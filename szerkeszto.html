<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edzés-szerkesztő</title>
<style>
  :root{
    --bg: #12201B;
    --surface: #1B2C25;
    --surface-2: #24392F;
    --surface-3: #2E4A3C;
    --line: rgba(242,245,241,0.12);
    --text: #F2F5F1;
    --text-dim: #9FB3A8;
    --accent: #8FBF9F;
    --accent-deep: #6FA482;
    --warn: #E8B984;
    --danger: #D97757;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line); flex:none;
    gap:12px; flex-wrap:wrap;
  }
  header h1{ font-size:17px; margin:0; font-weight:650; }
  header .status{ font-size:12.5px; color:var(--text-dim); }
  .btn{
    background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font-size:13.5px; cursor:pointer; font-weight:560;
  }
  .btn:hover{ background:var(--surface-3); }
  .btn.primary{ background:var(--accent); color:#0E1712; border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-deep); }
  .btn.danger{ background:transparent; color:var(--danger); border-color:var(--danger); }
  .btn.small{ padding:4px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .layout{ flex:1; display:grid; grid-template-columns: 230px minmax(0,1fr) minmax(340px,400px); min-height:0; }
  .col{ overflow-y:auto; padding:16px; border-right:1px solid var(--line); }
  .col:last-child{ border-right:none; }
  .col h2{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:0 0 12px; }

  /* A tréning részletei fejléc-sávként a szerkesztő fölött (középső oszlop). */
  .details-panel{ margin:-16px -16px 18px; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
  .details-panel h2{ margin-bottom:8px; }
  #rightContent{ display:flex; flex-wrap:wrap; gap:3px 20px; }
  #rightContent .empty-hint{ padding:4px 0; }
  #rightContent .detail-stat{ display:inline-flex; align-items:baseline; gap:6px; border:none; padding:2px 0; font-size:12.5px; }
  #rightContent .detail-stat span:first-child::after{ content:":"; }
  #rightContent .dur-table{ flex-basis:100%; margin:4px 0; }
  .dur-table table{ border-collapse:collapse; font-size:12.5px; max-width:100%; }
  .dur-table th, .dur-table td{ border:1px solid var(--line); padding:3px 10px; text-align:center; white-space:nowrap; }
  .dur-table th{ color:var(--text-dim); font-weight:600; background:var(--bg); }
  .dur-table th:first-child, .dur-table td.dur-label{ text-align:left; color:var(--text-dim); }
  .dur-table td{ font-weight:600; }
  .dur-table th.cur, .dur-table td.cur{ background:var(--surface-3); color:var(--text); }
  #rightContent .warn-block{ flex-basis:100%; margin-top:4px; }
  #rightContent .warn-block > div{ margin-top:0 !important; }
  #rightContent .warn-list{ margin:3px 0 0; padding-left:18px; }

  /* A gyakorlatkönyvtár a teljes jobb oszlopot elfoglalja. */
  #colLibrary{ padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .library-panel{ padding:16px; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .library-panel > h2{ display:flex; justify-content:space-between; align-items:center; flex:none; }
  .library-panel .lib-controls{ flex:none; }
  #libList{ flex:1 1 auto; min-height:0; overflow-y:auto; margin-top:8px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin-bottom:8px; cursor:pointer;
  }
  .card:hover{ background:var(--surface-2); }
  .card.selected{ border-color:var(--accent); background:var(--surface-2); }
  .card .name{ font-weight:600; font-size:14.5px; }
  .card .meta{ color:var(--text-dim); font-size:12px; margin-top:4px; }

  label{ display:block; font-size:12px; color:var(--text-dim); margin:12px 0 4px; font-weight:600; }
  input[type=text], input[type=number], input[type=password], textarea, select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13.5px; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:60px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .tag-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .tag{
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px;
    cursor:pointer; user-select:none; color:var(--text-dim);
  }
  .tag.on{ background:var(--accent); color:#0E1712; border-color:var(--accent); font-weight:600; }

  .block-section{ margin-top:18px; }
  .block-title{ font-size:13px; font-weight:700; margin-bottom:6px; }
  .block-list{ border-radius:8px; }
  .block-item{
    display:flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:5px; font-size:13px;
  }
  .block-item .bi-name{ flex:1; }
  .block-item .bi-badge{ font-size:10.5px; color:var(--text-dim); border:1px solid var(--line); border-radius:5px; padding:1px 5px; }
  .block-item .bi-badge.variant{ color:var(--accent); border-color:var(--accent); }
  .block-item button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:2px 4px; }
  .block-item button:hover{ color:var(--text); }
  .block-item button.on{ color:var(--accent); }
  .bi-variants{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:-3px 0 6px 10px; }
  .bi-var-chip{ font-size:10.5px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 4px 1px 6px; display:inline-flex; align-items:center; gap:2px; }
  .bi-var-chip.base{ color:var(--text); }
  .bi-var-chip button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; padding:0 1px; line-height:1; }
  .bi-var-chip button:hover{ color:var(--danger); }
  .bi-var-note{ font-size:10px; color:var(--text-dim); font-style:italic; }
  .empty-hint{ color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center; }

  .lib-item{
    display:flex; align-items:center; gap:8px;
    padding:7px 9px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px;
  }
  .lib-item:hover{ background:var(--surface-2); }
  .lib-item.pick{ cursor:pointer; }
  .lib-item.pick:hover{ background:var(--surface-3); border-color:var(--accent); }
  .lib-pick-hint{ font-size:12px; color:var(--accent); margin:6px 0 2px; line-height:1.4; }
  .lib-item .li-info{ flex:1; min-width:0; }
  .lib-item .li-name{ font-size:13px; font-weight:560; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lib-item .li-tags{ font-size:11px; color:var(--text-dim); }

  .detail-stat{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .detail-stat span:first-child{ color:var(--text-dim); }
  .warn-list li{ color:var(--warn); font-size:12.5px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    width:100%; max-width:560px; max-height:85vh; overflow-y:auto; padding:20px;
  }
  .modal h3{ margin:0 0 12px; }

  .ex-tooltip{
    position:fixed; z-index:80; width:240px; background:var(--surface-3);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px;
    line-height:1.45; box-shadow:0 10px 28px rgba(0,0,0,.4); pointer-events:none;
    opacity:0; transform:translateY(4px); transition:opacity .12s ease, transform .12s ease;
  }
  .ex-tooltip.show{ opacity:1; transform:translateY(0); }
  .ex-tooltip img{ width:100%; height:110px; object-fit:cover; border-radius:6px; margin-bottom:8px; display:block; background:var(--surface); }
  .ex-tooltip .tt-name{ font-weight:700; margin-bottom:3px; font-size:13px; }
  .ex-tooltip .tt-meta{ color:var(--text-dim); margin-bottom:4px; }
  .ex-tooltip .tt-desc{ color:var(--text); }

  /* Gyakorlatok nézet (teljes oldalas, a szerkesztőn belül) */
  body.view-exercises .tabs, body.view-exercises .layout{ display:none !important; }
  #viewExercises{ display:none; flex:1; flex-direction:column; min-height:0; overflow-y:auto; padding:16px 20px 28px; }
  body.view-exercises #viewExercises{ display:flex; }
  .ex-view-bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .ex-view-bar h2{ flex:1; margin:0; font-size:16px; min-width:120px; }
  .ex-view-controls{ max-width:900px; width:100%; margin-bottom:14px; }
  .ex-view-controls .tag-grid{ margin-top:8px; }
  .ex-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; align-items:start; }
  .ex-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; }
  .ec-images{ display:flex; gap:8px; }
  .ec-images img{ flex:1; min-width:0; max-height:170px; object-fit:contain; background:var(--surface-2); border-radius:8px; }
  .ec-images img.noimg{ opacity:.4; }
  .ec-name{ font-weight:700; font-size:15px; }
  .ec-sub{ color:var(--text-dim); font-size:12.5px; margin-top:-4px; }
  .ec-badges, .ec-chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .ec-badge{ font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--text-dim); }
  .ec-badge.q{ color:var(--accent); border-color:var(--accent); }
  .ec-chip{ font-size:11.5px; background:var(--surface-2); border-radius:999px; padding:2px 8px; color:var(--text-dim); }
  .ec-chip.eq{ background:transparent; border:1px dashed var(--line); }
  .ec-desc{ font-size:13px; line-height:1.5; white-space:pre-wrap; }
  .ec-switch{ font-size:12.5px; line-height:1.45; white-space:pre-wrap; color:var(--text-dim); border-left:2px solid var(--line); padding-left:8px; }
  .ec-switch b{ color:var(--text); }
  .ec-use-btn{ background:none; border:none; color:var(--accent); font-size:12px; cursor:pointer; padding:0; text-align:left; }
  .ec-use-list{ font-size:12px; color:var(--text-dim); margin:4px 0 0; padding-left:16px; }
  .ec-actions{ display:flex; gap:8px; padding-top:2px; }
  .btn.danger.solid{ background:var(--danger); color:#1b0e08; }
  .del-all{ display:flex; gap:10px; align-items:center; margin:10px 0 4px; font-size:13px; }
  .del-all select{ flex:1; min-width:0; }
  .del-row{ display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:13px; }
  .del-row .dr-label{ flex:1; min-width:0; }
  .del-row select{ flex:0 0 52%; min-width:0; }
  .auth-err{ color:var(--danger); font-size:12.5px; margin:8px 0 0; min-height:16px; }
  .auth-remember{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text-dim); }
  .auth-remember input{ width:auto; }
  .del-note{ font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.45; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--line); border-radius:8px;
    padding:10px 18px; font-size:13.5px; z-index:60; display:none;
  }
  .toast.show{ display:block; }
  .toast.err{ border-color:var(--danger); color:var(--danger); }

  /* mobil: tab-alapú, egy oszlop */
  .tabs{ display:none; }
  @media (max-width: 900px){
    .layout{ display:block; }
    .col{ display:none; border-right:none; padding:14px; }
    .col.active{ display:block; }
    #colLibrary.active{ display:flex; }
    #colLibrary{ overflow-y:auto; }
    .details-panel{ margin:-14px -14px 14px; padding:14px; overflow:visible; }
    .library-panel{ flex:none; overflow:visible; }
    #libList{ overflow:visible; }
    .tabs{ display:flex; border-bottom:1px solid var(--line); flex:none; }
    .tabs button{
      flex:1; padding:12px; background:none; border:none; color:var(--text-dim);
      font-size:13px; font-weight:600; border-bottom:2px solid transparent; cursor:pointer;
    }
    .tabs button.active{ color:var(--text); border-color:var(--accent); }
    .ex-tooltip{ display:none; }
    #viewExercises{ padding:14px; }
    .ex-grid{ grid-template-columns:1fr; }
    .del-row, .del-all{ flex-direction:column; align-items:stretch; gap:6px; }
    .del-row select{ flex:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Edzés-szerkesztő</h1>
  <div class="status" id="statusEl">Betöltés…</div>
  <div style="display:flex; gap:8px;">
    <button class="btn" id="btnExercises">Gyakorlatok</button>
    <button class="btn" id="btnReload">Frissítés</button>
    <button class="btn primary" id="btnSave" disabled>Mentés</button>
  </div>
</header>
<div id="ctxBar" hidden style="font-size:12px;font-weight:600;text-align:center;padding:5px 8px;"></div>

<div class="tabs">
  <button class="tab-btn active" data-col="trainings">Tréningek</button>
  <button class="tab-btn" data-col="edit">Szerkesztés</button>
  <button class="tab-btn" data-col="library">Könyvtár</button>
</div>

<div class="layout">
  <div class="col active" id="colTrainings">
    <h2 style="display:flex;justify-content:space-between;align-items:center;">
      <span>Tréningek</span>
      <button class="btn small primary" id="btnNewProgram">+ Új</button>
    </h2>
    <div id="midContent"></div>
  </div>

  <div class="col" id="colEdit">
    <div class="details-panel">
      <h2>Tréning részletei</h2>
      <div id="rightContent"><div class="empty-hint">Válassz egy tréninget a listából.</div></div>
    </div>
    <h2>Szerkesztés alatt</h2>
    <div id="leftContent"><div class="empty-hint">Válassz egy tréninget a bal oldali listából, vagy hozz létre újat.</div></div>
  </div>

  <div class="col" id="colLibrary">
    <div class="library-panel">
      <h2>
        <span>Gyakorlatkönyvtár</span>
        <button class="btn small" id="btnNewExercise">+ Új</button>
      </h2>
      <div class="lib-controls">
        <input type="text" id="libSearch" placeholder="Keresés név szerint…">
        <div class="tag-grid" id="libTargetSelector" style="margin-top:8px; align-items:center;"></div>
        <div class="tag-grid" id="libTagFilter"></div>
      </div>
      <div id="libList"></div>
    </div>
  </div>
</div>

<section id="viewExercises">
  <div class="ex-view-bar">
    <button class="btn" id="btnBackToEditor">← Szerkesztő</button>
    <h2 id="exViewTitle">Gyakorlatok</h2>
    <button class="btn primary" id="btnNewExerciseView">+ Új gyakorlat</button>
  </div>
  <div class="ex-view-controls">
    <input type="text" id="exViewSearch" placeholder="Keresés név szerint…">
    <div class="tag-grid" id="exViewCats"></div>
    <div class="tag-grid" id="exViewTags"></div>
  </div>
  <div class="ex-grid" id="exViewGrid"></div>
</section>

<div class="modal-backdrop" id="authModal">
  <div class="modal" style="max-width:380px;">
    <h3>Belépés a mentéshez</h3>
    <form id="authForm" autocomplete="on">
      <label for="authUser">Felhasználó</label>
      <input type="text" id="authUser" name="username" autocomplete="username" value="szerkeszto" readonly>
      <label for="authPass">Szerkesztő jelszó</label>
      <input type="password" id="authPass" name="password" autocomplete="current-password" required>
      <div class="auth-err" id="authErr" role="alert"></div>
      <label class="auth-remember"><input type="checkbox" id="authRemember" checked> Megjegyzés ebben a böngészőben</label>
      <div style="text-align:right; margin-top:14px; display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn" id="authCancel">Mégse</button>
        <button type="submit" class="btn primary" id="authSubmit">Belépés</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="delModal">
  <div class="modal" style="max-width:660px;">
    <h3 id="delTitle">Gyakorlat törlése</h3>
    <div id="delBody"></div>
    <div style="text-align:right; margin-top:14px; display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn" id="delCancel">Mégse</button>
      <button class="btn danger solid" id="delConfirm" disabled>Törlés</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="exModal">
  <div class="modal">
    <h3 id="exModalTitle">Gyakorlat szerkesztése</h3>
    <div id="exForm"></div>
    <div style="text-align:right; margin-top:14px; display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn danger" id="exDelete" style="margin-right:auto;">Gyakorlat törlése</button>
      <button class="btn" id="exCancel">Mégse</button>
      <button class="btn primary" id="exSave">Mentés</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EQUIPMENT = [
  "Felfújható labda", "Súlyzók", "Gumiszalagok", "Lábsúlyok", "Jógatégla",
  "Sima henger", "Rücskös henger", "Masszázslabda", "Ajtókeret/kilincs"
];
const CATEGORIES = { warmup: "Bemelegítés", main: "Fő rész", cooldown: "Levezetés" };
// A program-blokkok címkéi. A "roundRest" nem gyakorlat-kategória (egy
// gyakorlat category mezője csak warmup/main/cooldown lehet) - ez egy
// negyedik, opcionális blokk egy programon belül: a fő körök közötti pihenőt
// tölti ki gyakorlatokkal (pl. könnyű nyújtással) a puszta visszaszámlálás
// helyett/mellett.
const BLOCK_LABELS = Object.assign({ roundRest: "Pihenő a körök között" }, CATEGORIES);
const PROGRAM_BLOCK_KEYS = ['warmup', 'main', 'cooldown', 'roundRest'];

let data = null;
let selectedProgramId = null;
let editingProgram = null;   // direkt referencia a data.programs egy elemére
let dirty = false;
// A mentés a dev branchre commitol egy Netlify function-ön keresztül. Ezt a
// szerkesztő a dev -> main PR deploy preview URL-jén futtatva lehet használni.
const saveCtx = { context: null, loadedCommit: null, headSha: null, baseSha: null };
// Feltöltött, még nem mentett képek: "images/foo.webp" -> Blob. Mentéskor a
// bájtok ugyanabba az atomi git commitba kerülnek, mint a JSON.
const pendingImages = new Map();
// Előnézetben mutatott helykitöltő kép, amíg egy gyakorlathoz nincs saját kép megadva.
// Nem kerül bele a mentett rekordba – csak vizuális fallback.
const DEFAULT_IMG = 'images/default.webp';
let exEditContext = null;
let libTagFilterState = new Set();
let libraryTargetBlock = 'main';  // melyik blokkba kerül a → gombbal hozzáadott gyakorlat
let variantTarget = null;  // ha van érték: a könyvtárból választott gyakorlat ehhez a fő-blokk elemhez kerül kör-variánsként

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const slugify = (s) => (s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };

// Az átméretezett képet Blob-ként adja vissza (webp, régi Safarin jpeg). NEM
// data: URL – a bájtok mentéskor valódi fájlként kerülnek a repóba.
function resizeImageToBlob(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Nem sikerült beolvasni a fájlt.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Nem sikerült megnyitni a képet.'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          if (blob && blob.type === 'image/webp'){ resolve(blob); return; }
          canvas.toBlob((jpg) => jpg ? resolve(jpg) : reject(new Error('Nem sikerült kódolni a képet.')),
            'image/jpeg', quality);
        }, 'image/webp', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function blobToBase64(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

// Az összes kép-útvonal, amit valamelyik gyakorlat épp használ.
function imagePathsInUse(){
  const s = new Set();
  for (const ex of Object.values(data.exercises || {})){
    if (ex.image) s.add(ex.image);
    if (ex.image_right) s.add(ex.image_right);
  }
  return s;
}

// Szabad kép-útvonalat választ egy alapnév köré (ütközésnél rövid utótag).
function freeImagePath(base, ext = 'webp'){
  const slug = slugify(base) || 'kep';
  const used = imagePathsInUse();
  let cand = `images/${slug}.${ext}`;
  while (used.has(cand) || pendingImages.has(cand)){
    cand = `images/${slug}-${Math.random().toString(36).slice(2, 6)}.${ext}`;
  }
  return cand;
}

// Animált kép (GIF / animált WebP / APNG) felismerése a fájl bájtjaiból; a
// visszaadott érték a megtartandó kiterjesztés, állókép esetén null. A canvasos
// átméretezés (resizeImageToBlob) csak az első képkockát őrizné meg, ezért az
// animált képeket érintetlenül töltjük fel.
async function animatedImageExt(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const str = (a, b) => String.fromCharCode(...buf.subarray(a, b));
  if (str(0, 4) === 'GIF8'){
    let frames = 0;   // grafikus vezérlő kiterjesztések (21 F9): >= 2 -> több képkocka
    for (let i = 0; i + 1 < buf.length; i++){
      if (buf[i] === 0x21 && buf[i + 1] === 0xF9 && ++frames >= 2) return 'gif';
    }
    return null;
  }
  if (str(0, 4) === 'RIFF' && str(8, 12) === 'WEBP'){
    return (str(12, 16) === 'VP8X' && (buf[20] & 0x02)) ? 'webp' : null;   // animáció-bit
  }
  if (buf[0] === 0x89 && str(1, 4) === 'PNG'){
    for (let i = 8; i + 8 <= buf.length;){
      const len = ((buf[i] << 24) | (buf[i + 1] << 16) | (buf[i + 2] << 8) | buf[i + 3]) >>> 0;
      const type = str(i + 4, i + 8);
      if (type === 'acTL') return 'png';   // APNG animáció-vezérlő
      if (type === 'IDAT') return null;
      i += 12 + len;
    }
  }
  return null;
}

const MAX_ANIMATED_BYTES = 3 * 1024 * 1024;   // a mentés egyszerre ~4 MB képet fogad (save-data.mjs)

// A kiválasztott fájlt átméretezi (animáltat érintetlenül hagyja), felstage-eli,
// és visszaadja az útvonalát.
async function stageImage(file, base){
  const animExt = await animatedImageExt(file);
  if (animExt){
    if (file.size > MAX_ANIMATED_BYTES){
      throw new Error(`az animált kép ${(file.size / 1048576).toFixed(1)} MB, a limit 3 MB – kicsinyítsd vagy rövidítsd az animációt`);
    }
    const path = freeImagePath(base, animExt);
    pendingImages.set(path, file);
    return path;
  }
  const blob = await resizeImageToBlob(file, 800, 0.85);
  const path = freeImagePath(base);
  pendingImages.set(path, blob);
  return path;
}

function toast(msg, isErr){

}

function setDirty(v){ dirty = v; updateSaveEnabled(); }

const CAN_SAVE_CONTEXTS = ['deploy-preview', 'branch-deploy'];
function canSave(){ return CAN_SAVE_CONTEXTS.includes(saveCtx.context); }
function deployRunning(){
  return canSave() && saveCtx.headSha && saveCtx.loadedCommit && saveCtx.headSha !== saveCtx.loadedCommit;
}

function renderCtxBar(){
  const bar = $('#ctxBar');

    bg = '#D69C5C';
  } else if (deployRunning()){
    msg = 'Épp fut egy build az új mentésből – frissíts kb. egy perc múlva, mielőtt tovább szerkesztesz.';
    bg = '#D69C5C';

    msg = 'PR preview – a Mentés a dev branchre commitol, a változás a PR-en és ~1 perc múlva a preview-n látszik.';

function updateSaveEnabled(){
  $('#btnSave').disabled = !(dirty && canSave() && !deployRunning());
}

async function loadData(){
  $('#statusEl').textContent = 'Betöltés…';
  try{
    const [dataRes, ctxRes] = await Promise.all([
      fetch('data/trainings.json', { cache: 'no-cache' }),
      fetch('/api/save-data').catch(() => null),
    ]);
    if (!dataRes.ok) throw new Error('HTTP ' + dataRes.status);
    data = await dataRes.json();
    const meta = data._meta || {};
    saveCtx.context = meta.context || 'ismeretlen';
    saveCtx.loadedCommit = meta.commit || null;
    if (ctxRes && ctxRes.ok){
      const c = await ctxRes.json().catch(() => ({}));
      saveCtx.headSha = c.headSha || null;
      saveCtx.baseSha = c.headSha || null;
    } else {
      saveCtx.headSha = null;
      saveCtx.baseSha = null;
    }
    pendingImages.clear();
    stagedImageUrls.forEach(u => URL.revokeObjectURL(u));
    stagedImageUrls.clear();
    $('#statusEl').textContent = 'Betöltve';
    renderMid();
    renderRight();
    renderLeft();
    renderLibraryPanel();
    renderCtxBar();
    applyViewFromHash();
  } catch(err){
    $('#statusEl').textContent = 'Hiba a betöltéskor';
    toast('Nem sikerült betölteni az adatokat: ' + err.message, true);
  }
}

async function saveData(){
  if (!canSave()){
    toast('Ebben a nézetben nem lehet menteni – nyisd meg a dev → main PR preview URL-jét.', true);
    return;
  }
  if (deployRunning()){
    toast('Előbb frissíts – épp fut egy build az előző mentésből.', true);
    return;
  }
  const token = await ensureEditToken();
  if (!token) return;
  if (!saveCtx.baseSha){
    toast('Nincs meg a dev branch feje – kattints a Frissítésre.', true);
    return;
  }
  $('#btnSave').disabled = true;
  try{
    const used = imagePathsInUse();
    const images = {};
    for (const [path, blob] of pendingImages){
      if (used.has(path)) images[path] = await blobToBase64(blob);
    }
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-edit-token': token },
      body: JSON.stringify({ baseSha: saveCtx.baseSha, data, images, message: 'Szerkesztő: adatmentés' }),
    });
    const out = await res.json().catch(() => ({}));
    if (res.status === 401){
      localStorage.removeItem('szerkeszto_token');
      // Hibás jelszó: az űrlap magától újranyílik a hibaüzenettel, nem kell újra a Mentésre kattintani.
      authErrorNext = 'Hibás jelszó – próbáld újra.';
      setTimeout(saveData, 0);
      return;
    }
    if (res.status === 409){
      if (out.headSha) saveCtx.headSha = out.headSha;
      renderCtxBar();
      toast('A dev branch közben elmozdult. Kattints a Frissítésre.', true);
      return;
    }
    if (res.status === 400 && Array.isArray(out.errors)){
      console.warn('Validációs hibák:', out.errors);
      toast('Az adat nem valid: ' + out.errors[0], true);
      return;
    }
    if (!res.ok) throw new Error(out.error || ('HTTP ' + res.status));
    saveCtx.baseSha = out.commit;
    saveCtx.headSha = out.commit;
    saveCtx.loadedCommit = out.commit;
    pendingImages.clear();
    setDirty(false);
    renderCtxBar();
    toast(out.changed && out.changed.length
      ? `Mentve (${out.changed.length + (out.deleted ? out.deleted.length : 0)} fájl). A PR preview ~1 percen belül frissül.`
      : 'Nem volt változás a mentésre.');
  } catch(err){
    toast('Mentés sikertelen: ' + err.message, true);
  } finally {
    updateSaveEnabled();
  }
}

// A sor "gyors pihenője": az adott gyakorlat ELŐTTI pihenő rövid (quick_rest_sec)
// vagy normál (rest_sec). A program-elem "quickRest" mezője felülírja a gyakorlat
// "quick_rest_default" alapértékét. Oldalas (bal/jobb) gyakorlatnál az alapérték
// nem érvényes az első oldal előtti pihenőre (csak a program-elem kifejezett
// beállítása), a két oldal közti pihenő külön, alapból gyors.
function quickRestDefault(ex){ return !!(ex && !ex.sided && ex.quick_rest_default); }
function effectiveQuickRest(item, ex){
  return item.quickRest != null ? !!item.quickRest : quickRestDefault(ex);
}

/* ---------- Jobb oszlop felül: kiválasztott tréning részletei ---------- */

// A tréning becsült teljes ideje másodpercben a megadott körszámmal. Az index.html
// buildQueue()-jának ütemezését tükrözi (előkészület, bemelegítés, fő körök,
// körök közti pihenő / roundRest, levezetés, blokk-átmenetek, gyors pihenők);
// ha ott változik az ütemezés, itt is módosítani kell.
function estimateDurationSec(p, rounds){
  const C = data.constants;
  const stepsOf = (item, ex) => {
    if (!ex) return [];
    const dur = (ex.duration_sec != null ? ex.duration_sec : null);
    if (ex.sided){
      return [
        { dur: dur || C.work_sec, quick: item.quickRest === true },
        { dur: dur || C.work_sec, quick: item.quickRestOverride != null ? !!item.quickRestOverride : true },
      ];
    }
    const d = item.durationOverride != null ? item.durationOverride : dur;
    return [{ dur: d || C.work_sec, quick: item.quickRest != null ? !!item.quickRest : quickRestDefault(ex) }];
  };
  const expand = (items, pick) => {
    const out = [];
    (items || []).forEach(it => out.push(...stepsOf(it, pick ? pick(it) : data.exercises[it.exerciseId])));
    return out;
  };
  const restBefore = st => (st && st.quick) ? C.quick_rest_sec : C.rest_sec;
  // Lépések összideje, köztük a pihenőkkel (az első előtt nincs pihenő).
  const seq = steps => steps.reduce((t, st, i) => t + st.dur + (i ? restBefore(st) : 0), 0);
  const mainOf = r => expand(p.blocks.main, it => {
    const chain = [it.exerciseId].concat(Array.isArray(it.variants) ? it.variants : []);
    return data.exercises[chain[(r - 1) % chain.length]] || data.exercises[it.exerciseId];
  });
  const warmup = expand(p.blocks.warmup);
  const cooldown = expand(p.blocks.cooldown);
  const roundRest = expand(p.blocks.roundRest);

  let total = C.prep_sec;
  if (warmup.length) total += seq(warmup) + C.block_transition_sec;
  for (let r = 1; r <= rounds; r++){
    total += seq(mainOf(r));
    if (r < rounds){
      if (!roundRest.length) total += C.round_rest_sec;
      else {
        // pihenő az első elem előtt, az elemek között és az utolsó után is
        total += seq(roundRest) + restBefore(roundRest[0]) + restBefore(mainOf(r + 1)[0]);
      }
    }
  }
  if (cooldown.length) total += C.block_transition_sec + seq(cooldown);
  return total;
}

function fmtDuration(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

// Kis táblázat: mennyi ideig tart a tréning 2, 3 vagy 4 körrel.
function durationTable(p){
  const wrap = el('div', 'dur-table');
  const tbl = document.createElement('table');
  const head = tbl.createTHead().insertRow();
  const body = tbl.createTBody().insertRow();
  head.appendChild(el('th', '', 'Időtartam'));
  body.appendChild(el('td', 'dur-label', 'összesen'));
  [2, 3, 4].forEach(n => {
    const th = el('th', p.rounds === n ? 'cur' : '', n + ' kör');
    const sec = estimateDurationSec(p, n);
    const td = el('td', p.rounds === n ? 'cur' : '', '~' + Math.round(sec / 60) + ' perc');
    td.title = fmtDuration(sec) + ' (perc:mp)';
    head.appendChild(th); body.appendChild(td);
  });
  wrap.appendChild(tbl);
  return wrap;
}

function renderRight(){
  const c = $('#rightContent');

  c.innerHTML = '';

  c.appendChild(el('div','detail-stat', `<span>Körök</span><span>${p.rounds}</span>`));
  const warnings = [];
  const equipmentSet = new Set();
  PROGRAM_BLOCK_KEYS.forEach(k => {
    (p.blocks[k]||[]).forEach(item => {
      const ex = data.exercises[item.exerciseId];
      if (!ex){ warnings.push(`Hiányzó gyakorlat-hivatkozás: ${item.exerciseId}`); return; }
      (ex.equipment||[]).forEach(e => equipmentSet.add(e));
      if (!ex.image && !ex.legacy_pose_a) warnings.push(`Nincs kép/ábra: ${ex.name}`);
      if (!ex.description) warnings.push(`Hiányzó leírás: ${ex.name}`);
      if (k === 'main' && Array.isArray(item.variants)){
        item.variants.forEach(vid => {
          const vex = data.exercises[vid];
          if (!vex){ warnings.push(`Hiányzó kör-variáns (${ex.name}): ${vid}`); return; }
          if (!!vex.sided !== !!ex.sided) warnings.push(`Kör-variáns oldalisága eltér: ${vex.name} (alap: ${ex.name})`);
          (vex.equipment||[]).forEach(e => equipmentSet.add(e));
        });
      }
    });
    c.appendChild(el('div','detail-stat', `<span>${BLOCK_LABELS[k]}</span><span>${(p.blocks[k]||[]).length} gyakorlat</span>`));
  });
  c.appendChild(durationTable(p));
  c.appendChild(el('div','detail-stat', `<span>Szükséges eszközök</span><span>${equipmentSet.size ? [...equipmentSet].join(', ') : 'nincs'}</span>`));
  if (warnings.length){
    const w = el('div', 'warn-block', '<div style="margin-top:14px; font-weight:600; font-size:12.5px;">Figyelmeztetések</div>');
    const ul = el('ul','warn-list');
    warnings.forEach(x => ul.appendChild(el('li','',x)));

    c.appendChild(w);
  }
}

    let baseId = slugify(p.name) + '-masolat';
    let newId = baseId, n = 2;
    while (data.programs.some(x => x.id === newId)) newId = baseId + '-' + (n++);
    copy.id = newId;
    copy.name = p.name + ' (másolat)';
    copy._isNew = true;
    data.programs.push(copy);
    editingProgram = copy;
    selectedProgramId = null;
    setDirty(true);
    renderMid(); renderLeft(); renderRight();
    toast('Tréning duplikálva – nevezd át, és a gyakorlatokat is módosíthatod.');
  };
  actions.appendChild(dupBtn);
  if (!p._isNew){
    const delBtn = el('button','btn danger','Tréning törlése');
    delBtn.onclick = () => {
      if (!confirm(`Biztosan törlöd a(z) "${p.name}" tréninget?`)) return;
      data.programs = data.programs.filter(x => x.id !== p.id);
      editingProgram = null; selectedProgramId = null;
      setDirty(true); renderMid(); renderRight(); renderLeft();
    };
    actions.appendChild(delBtn);
  }
  c.appendChild(actions);
}

function newProgram(){
  if (dirty && !confirm('Nem mentett módosításaid vannak. Elveted őket?')) return;
  variantTarget = null;
  const p = { id: 'uj-treninig-' + Date.now().toString(36), name: 'Új tréning', rounds: 2,
              blocks: { warmup: [], main: [], cooldown: [] }, _isNew: true };
  editingProgram = p;
  selectedProgramId = null;
  data.programs.push(p);
  setDirty(true);
  renderMid(); renderLeft();
  showTab('edit');
}

/* ---------- Gyakorlat hozzáadása a könyvtárból: cél-blokk + nyíl gomb ---------- */

function addExerciseToTargetBlock(exerciseId){
  if (!editingProgram){ toast('Előbb válassz (vagy hozz létre) egy tréninget a bal oldali listából.', true); return; }
  if (variantTarget){ addVariantToTarget(exerciseId); return; }
  (editingProgram.blocks[libraryTargetBlock] || (editingProgram.blocks[libraryTargetBlock] = [])).push({ exerciseId });
  setDirty(true);
  renderLeft();
  renderMid();
  toast('Hozzáadva: ' + BLOCK_LABELS[libraryTargetBlock] + '.');
}

// A könyvtárból választott gyakorlatot kör-variánsként fűzi a kijelölt fő-blokk
// elemhez. Az időzítő a lépésszámot köröktől függetlennek feltételezi, ezért
// csak azonos oldalisággal (sided) rendelkező variánst engedünk.
function addVariantToTarget(exerciseId){
  const item = variantTarget;
  if (!item) return;
  const baseEx = data.exercises[item.exerciseId];
  const newEx = data.exercises[exerciseId];
  if (!newEx){ toast('Ismeretlen gyakorlat.', true); return; }
  if (!!(baseEx && baseEx.sided) !== !!newEx.sided){
    toast('A variáns oldalisága (bal/jobb) nem egyezik az alapgyakorlatéval.', true);
    return;
  }
  const chain = [item.exerciseId].concat(item.variants || []);
  if (chain.includes(exerciseId)){ toast('Ez a gyakorlat már szerepel a körváltásban.', true); return; }
  (item.variants || (item.variants = [])).push(exerciseId);
  setDirty(true);
  renderLeft();
  renderRight();
  toast('Variáns: ' + (item.variants.length + 1) + '. kör – ' + newEx.name + '.');
}

/* ---------- Egyedi tooltip (gyakorlat teljes adatlapja, képpel) ---------- */

let tooltipEl = null;
function ensureTooltip(){
  if (!tooltipEl){
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'ex-tooltip';
    document.body.appendChild(tooltipEl);
  }
  return tooltipEl;
}
function attachTooltip(row, ex){
  row.addEventListener('mouseenter', (e) => showTooltip(ex, e));
  row.addEventListener('mousemove', positionTooltip);
  row.addEventListener('mouseleave', hideTooltip);
}
function showTooltip(ex, e){
  const t = ensureTooltip();
  let html = '';
  if (ex.image) html += `<img src="${escapeHtml(ex.image)}" alt="" onerror="this.remove()">`;
  html += `<div class="tt-name">${escapeHtml(ex.name)}</div>`;
  const meta = [];
  if (ex.muscle_groups && ex.muscle_groups.length){
    meta.push(ex.muscle_groups.map(k => (data.muscle_group_taxonomy||{})[k] || k).join(', '));
  }
  if (ex.duration_sec) meta.push(ex.duration_sec + ' mp');
  if (ex.sided) meta.push('bal/jobb');
  if (meta.length) html += `<div class="tt-meta">${escapeHtml(meta.join(' · '))}</div>`;
  if (ex.equipment && ex.equipment.length) html += `<div class="tt-meta">Eszköz: ${escapeHtml(ex.equipment.join(', '))}</div>`;
  if (ex.description) html += `<div class="tt-desc">${escapeHtml(ex.description)}</div>`;
  t.innerHTML = html;
  t.classList.add('show');
  positionTooltip(e);
}
function positionTooltip(e){
  if (!tooltipEl) return;
  const pad = 16;
  const rect = tooltipEl.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 10) y = window.innerHeight - rect.height - 10;
  tooltipEl.style.left = Math.max(10,x) + 'px';
  tooltipEl.style.top = Math.max(10,y) + 'px';
}
function hideTooltip(){ if (tooltipEl) tooltipEl.classList.remove('show'); }

/* ---------- Gyakorlatok nézet (teljes oldalas) ---------- */

const NONE_CHOICE = '__none__';
let exViewSearch = '';
const exViewCats = new Set();
const exViewTags = new Set();
const stagedImageUrls = new Map();   // "images/x.webp" -> blob: URL a még nem mentett (feltöltött) képekhez

// DOM-elem szöveggel (textContent): az adat sosem kerül innerHTML-be.
const T = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

function stagedImageUrl(path){
  const blob = pendingImages.get(path);
  if (!blob) return null;
  if (!stagedImageUrls.has(path)) stagedImageUrls.set(path, URL.createObjectURL(blob));
  return stagedImageUrls.get(path);
}

function applyViewFromHash(){
  const on = location.hash === '#gyakorlatok';
  document.body.classList.toggle('view-exercises', on);
  if (on) renderExercisesView();
}
window.addEventListener('hashchange', applyViewFromHash);

// Hol szerepel egy gyakorlat a programokban (alap-gyakorlatként vagy kör-variánsként).
function findUsages(exId){
  const out = [];
  (data.programs || []).forEach(p => {
    PROGRAM_BLOCK_KEYS.forEach(bk => {
      ((p.blocks && p.blocks[bk]) || []).forEach((item, index) => {
        if (item.exerciseId === exId) out.push({ program: p, blockKey: bk, item, index, role: 'alap', variantIndex: -1 });
        (Array.isArray(item.variants) ? item.variants : []).forEach((vid, vi) => {
          if (vid === exId) out.push({ program: p, blockKey: bk, item, index, role: 'variáns', variantIndex: vi });
        });
      });
    });
  });
  return out;
}

function usageLabel(u){
  return `${u.program.name} › ${BLOCK_LABELS[u.blockKey]} › ${u.index + 1}. sor`
    + (u.role === 'variáns' ? ` (kör-variáns, ${u.variantIndex + 2}. kör)` : '');
}

function exerciseMatches(ex){
  const q = exViewSearch.trim().toLowerCase();
  if (q && !(ex.name || '').toLowerCase().includes(q)) return false;
  if (exViewCats.size && !exViewCats.has(ex.category)) return false;
  if (exViewTags.size && !(ex.muscle_groups || []).some(t => exViewTags.has(t))) return false;
  return true;
}

function renderExercisesView(){
  if (!data || !document.body.classList.contains('view-exercises')) return;
  const cats = $('#exViewCats');
  cats.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([k, label]) => {
    const t = T('div', 'tag' + (exViewCats.has(k) ? ' on' : ''), label);
    t.onclick = () => { if (exViewCats.has(k)) exViewCats.delete(k); else exViewCats.add(k); renderExercisesView(); };
    cats.appendChild(t);
  });
  const tags = $('#exViewTags');
  tags.innerHTML = '';
  Object.entries(data.muscle_group_taxonomy || {}).forEach(([k, label]) => {
    const t = T('div', 'tag' + (exViewTags.has(k) ? ' on' : ''), label);
    t.onclick = () => { if (exViewTags.has(k)) exViewTags.delete(k); else exViewTags.add(k); renderExercisesView(); };
    tags.appendChild(t);
  });
  const total = Object.keys(data.exercises).length;
  const entries = Object.entries(data.exercises)
    .filter(([, ex]) => exerciseMatches(ex))
    .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'hu'));
  $('#exViewTitle').textContent = `Gyakorlatok (${entries.length === total ? total : entries.length + ' / ' + total})`;
  const grid = $('#exViewGrid');
  grid.innerHTML = '';
  entries.forEach(([id, ex]) => grid.appendChild(exerciseCard(id, ex)));
  if (!entries.length) grid.appendChild(T('div', 'empty-hint', 'Nincs találat.'));
}

function exerciseCard(id, ex){
  const card = T('div', 'ex-card');

  const imgs = T('div', 'ec-images');
  const addImg = (path) => {
    const img = document.createElement('img');
    img.alt = ''; img.loading = 'lazy';
    const fallback = () => { img.onerror = null; img.src = DEFAULT_IMG; img.classList.add('noimg'); };
    const staged = path ? stagedImageUrl(path) : null;
    if (staged) img.src = staged;
    else if (path){ img.src = path; img.onerror = fallback; }
    else fallback();
    imgs.appendChild(img);
  };
  addImg(ex.image);
  if (ex.image_right) addImg(ex.image_right);
  card.appendChild(imgs);

  card.appendChild(T('div', 'ec-name', ex.name));
  if (ex.subtitle) card.appendChild(T('div', 'ec-sub', ex.subtitle));

  const badges = T('div', 'ec-badges');
  badges.appendChild(T('span', 'ec-badge', CATEGORIES[ex.category] || ex.category || '—'));
  if (ex.sided) badges.appendChild(T('span', 'ec-badge', 'bal/jobb' + (ex.side_labels ? ` (${ex.side_labels.left} / ${ex.side_labels.right})` : '')));
  if (ex.duration_sec) badges.appendChild(T('span', 'ec-badge', ex.duration_sec + ' mp'));
  if (ex.quick_rest_default) badges.appendChild(T('span', 'ec-badge q', '⚡ gyors pihenő (alapból)'));
  card.appendChild(badges);

  const chips = T('div', 'ec-chips');
  (ex.muscle_groups || []).forEach(k => chips.appendChild(T('span', 'ec-chip', (data.muscle_group_taxonomy || {})[k] || k)));
  (ex.equipment || []).forEach(e => chips.appendChild(T('span', 'ec-chip eq', e)));
  if (chips.children.length) card.appendChild(chips);

  if (ex.description) card.appendChild(T('div', 'ec-desc', ex.description));
  if (ex.sided && ex.description_switch){
    const sw = T('div', 'ec-switch');
    sw.appendChild(T('b', null, 'Váltás után' + (ex.side_labels ? ` (${ex.side_labels.right})` : '') + ': '));
    sw.appendChild(document.createTextNode(ex.description_switch));
    card.appendChild(sw);
  }

  const uses = findUsages(id);
  if (uses.length){
    const btn = T('button', 'ec-use-btn', `${uses.length} sorban szerepel ▾`);
    const list = T('ul', 'ec-use-list');
    list.style.display = 'none';
    uses.forEach(u => list.appendChild(T('li', null, usageLabel(u))));
    btn.onclick = () => {
      const open = list.style.display === 'none';
      list.style.display = open ? '' : 'none';
      btn.textContent = `${uses.length} sorban szerepel ${open ? '▴' : '▾'}`;
    };
    card.appendChild(btn);
    card.appendChild(list);
  } else {
    card.appendChild(T('div', 'ec-sub', 'Egyetlen programban sem szerepel.'));
  }

  const actions = T('div', 'ec-actions');
  const editB = T('button', 'btn small', '✎ Szerkesztés');
  editB.onclick = () => openExerciseEditor(id, false);
  const delB = T('button', 'btn small danger', '🗑 Törlés');
  delB.onclick = () => openDeleteDialog(id);
  actions.appendChild(editB);
  actions.appendChild(delB);
  card.appendChild(actions);
  return card;
}

/* ---------- Gyakorlat törlése (érintett sorok + helyettesítés) ---------- */

let delContext = null;

// Egy sorhoz jelölhető helyettesítők. A kör-variáns lánc (main sor "variants"-szal)
// minden tagjának azonos oldalisságúnak kell lennie (lásd lib/data-schema.mjs validate),
// és egy gyakorlat nem szerepelhet kétszer ugyanabban a láncban.
function replacementCandidates(exId, u){
  const item = u.item;
  const chain = [item.exerciseId].concat(Array.isArray(item.variants) ? item.variants : []);
  const others = chain.filter(id => id !== exId);
  const requiredSided = others.length ? !!(data.exercises[others[0]] || {}).sided : null;
  return Object.entries(data.exercises).filter(([id, ex]) =>
    id !== exId && !others.includes(id) && (requiredSided === null || !!ex.sided === requiredSided));
}

function buildChoiceSelect(cands, deletedEx){
  const sel = document.createElement('select');
  const add = (parent, value, text) => {
    const o = document.createElement('option');
    o.value = value; o.textContent = text;
    parent.appendChild(o);
  };
  add(sel, '', '— válassz —');
  add(sel, NONE_CHOICE, 'Nincs helyettesítő (a sor kimarad / rövidebb lesz)');
  const byName = (a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'hu');
  const near = cands.filter(([, ex]) => ex.category === deletedEx.category && !!ex.sided === !!deletedEx.sided).sort(byName);
  const rest = cands.filter(c => !near.includes(c)).sort(byName);
  const group = (label, list) => {
    if (!list.length) return;
    const g = document.createElement('optgroup');
    g.label = label;
    list.forEach(([id, ex]) => add(g, id, ex.name));
    sel.appendChild(g);
  };
  group('Ajánlott (azonos kategória és oldalisság)', near);
  group('Többi gyakorlat', rest);
  return sel;
}

function updateDelConfirm(){
  $('#delConfirm').disabled = !delContext || !delContext.selects.every(sel => sel.value !== '');
}

function closeDeleteDialog(){
  $('#delModal').classList.remove('open');
  delContext = null;
}

function openDeleteDialog(exId){
  const ex = data.exercises[exId];
  if (!ex) return;
  const uses = findUsages(exId);
  delContext = { exId, uses, selects: [] };
  $('#delTitle').textContent = `„${ex.name}” törlése`;
  const body = $('#delBody');
  body.innerHTML = '';

  if (!uses.length){
    body.appendChild(T('div', null, 'Ez a gyakorlat egyetlen programban sem szerepel, a törlés más sorokat nem érint.'));
    $('#delConfirm').disabled = false;
  } else {
    body.appendChild(T('div', null,
      `A gyakorlat ${uses.length} program-sorban szerepel. Soronként válaszd ki a helyettesítő gyakorlatot, `
      + 'vagy hogy nincs helyettesítő: ekkor a sor kimarad, a kör-variáns lánc pedig rövidebb lesz.'));

    const allWrap = T('div', 'del-all');
    allWrap.appendChild(T('span', null, 'Mindegyik sorhoz ugyanaz:'));
    const allCands = Object.entries(data.exercises).filter(([id]) => id !== exId);
    const allSel = buildChoiceSelect(allCands, ex);
    const allNote = T('div', 'del-note');
    allNote.style.marginTop = '0';
    allSel.onchange = () => {
      const v = allSel.value;
      if (!v) return;
      let skipped = 0;
      delContext.selects.forEach(sel => {
        if ([...sel.options].some(o => o.value === v)) sel.value = v; else skipped++;
      });
      allNote.textContent = skipped ? `${skipped} sornál nem alkalmazható (oldalisság / duplikáció), azt külön válaszd ki.` : '';
      allSel.value = '';
      updateDelConfirm();
    };
    allWrap.appendChild(allSel);
    body.appendChild(allWrap);
    body.appendChild(allNote);

    uses.forEach(u => {
      const row = T('div', 'del-row');
      row.appendChild(T('div', 'dr-label', usageLabel(u)));
      const sel = buildChoiceSelect(replacementCandidates(exId, u), ex);
      sel.onchange = updateDelConfirm;
      delContext.selects.push(sel);
      row.appendChild(sel);
      body.appendChild(row);
    });
    $('#delConfirm').disabled = true;
  }

  body.appendChild(T('div', 'del-note',
    'A gyakorlat képfájlja (images/) és hangfájljai (audio/) nem törlődnek automatikusan. '
    + 'A változás csak a Mentés után kerül a dev ágra; a Frissítés elveti.'));
  $('#delModal').classList.add('open');
}

// A választások alkalmazása a memóriabeli adaton. Egy sor "lánca" = [alap, ...variánsok]:
// helyettesítésnél a hely cserélődik, "nincs helyettesítő"-nél kikerül a láncból
// (az első megmaradó tag lesz az alap; ha üres a lánc, a sor kimarad).
function applyExerciseDeletion(exId, uses, choices){
  const name = data.exercises[exId].name;
  const groups = new Map();
  uses.forEach((u, i) => {
    if (!groups.has(u.item)) groups.set(u.item, []);
    groups.get(u.item).push({ pos: u.role === 'alap' ? 0 : u.variantIndex + 1, choice: choices[i] });
  });

  let replaced = 0, shortened = 0, removedRows = 0;
  const removeItems = new Set();
  groups.forEach((entries, item) => {
    const chain = [{ id: item.exerciseId }].concat((Array.isArray(item.variants) ? item.variants : []).map(id => ({ id })));
    let anyNone = false;
    entries.forEach(({ pos, choice }) => {
      if (choice === NONE_CHOICE){ chain[pos].del = true; anyNone = true; }
      else { chain[pos].id = choice; replaced++; }
    });
    const kept = chain.filter(c => !c.del).map(c => c.id);
    if (!kept.length){ removeItems.add(item); removedRows++; return; }
    item.exerciseId = kept[0];
    if (kept.length > 1) item.variants = kept.slice(1); else delete item.variants;
    if (anyNone) shortened++;
  });

  (data.programs || []).forEach(p => {
    PROGRAM_BLOCK_KEYS.forEach(bk => {
      if (p.blocks && Array.isArray(p.blocks[bk])) p.blocks[bk] = p.blocks[bk].filter(it => !removeItems.has(it));
    });
  });
  if (variantTarget && removeItems.has(variantTarget)) variantTarget = null;
  delete data.exercises[exId];

  setDirty(true);
  renderMid(); renderRight(); renderLeft(); renderLibraryPanel(); renderExercisesView();
  const parts = [];
  if (replaced) parts.push(`${replaced} helyettesítve`);
  if (shortened) parts.push(`${shortened} variáns-lánc rövidült`);
  if (removedRows) parts.push(`${removedRows} sor kimaradt`);
  toast(`Törölve: „${name}”` + (parts.length ? ' – ' + parts.join(', ') : '') + '. A Mentéssel kerül a dev ágra.');
}

function showTab(name){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.col === name));
  $('#colTrainings').classList.toggle('active', name==='trainings');

/* ---------- Globális gombok ---------- */

$('#btnNewProgram').onclick = newProgram;

$('#btnBackToEditor').onclick = () => { location.hash = ''; };
$('#btnNewExerciseView').onclick = () => openExerciseEditor(null, false);
$('#exViewSearch').oninput = (e) => { exViewSearch = e.target.value; renderExercisesView(); };

$('#delConfirm').onclick = () => {
  if (!delContext) return;
  const { exId, uses, selects } = delContext;
  const choices = selects.map(sel => sel.value);
  closeDeleteDialog();
  applyExerciseDeletion(exId, uses, choices);
};
$('#exDelete').onclick = () => {
  const ctx = exEditContext;
  if (!ctx || ctx.mode !== 'edit') return;
  $('#exModal').classList.remove('open');
  exEditContext = null;
  openDeleteDialog(ctx.exerciseId);
};
$('#btnSave').onclick = saveData;

function getEditToken(){
  return localStorage.getItem('szerkeszto_token');
}

// A jelszót valódi űrlap kéri (felhasználónév + jelszó mező), nem a natív prompt():
// így a böngésző jelszókezelője (Chrome, iCloud kulcsköteg) fel tudja ajánlani a
// mentést és ki tudja tölteni. A "Megjegyzés" jelölőnégyzet a localStorage-ba ment.
let authResolve = null;
let authErrorNext = '';

function askEditToken(errorMsg){
  return new Promise(resolve => {
    if (authResolve) authResolve(null);   // dupla kattintás: a korábbi, még függő kérés megszakad
    authResolve = resolve;
    $('#authErr').textContent = errorMsg || '';
    $('#authPass').value = '';
    $('#authModal').classList.add('open');
    setTimeout(() => $('#authPass').focus(), 0);
  });
}

function closeAuthDialog(value){
  $('#authModal').classList.remove('open');
  const resolve = authResolve;
  authResolve = null;
  if (resolve) resolve(value);
}

$('#authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const token = $('#authPass').value.trim();
  if (!token){ $('#authErr').textContent = 'Add meg a jelszót.'; return; }
  if ($('#authRemember').checked) localStorage.setItem('szerkeszto_token', token);
  closeAuthDialog(token);
});
$('#authCancel').onclick = () => closeAuthDialog(null);

async function ensureEditToken(){
  const stored = getEditToken();
  if (stored) return stored;
  const msg = authErrorNext;
  authErrorNext = '';
  return askEditToken(msg);
}

$('#btnReload').onclick = () => {
  if (dirty && !confirm('Nem mentett módosításaid vannak. Elveted őket és újratöltöd a szervertől?')) return;
  selectedProgramId = null; editingProgram = null; setDirty(false);
  loadData();
};

window.addEventListener('beforeunload', (e) => { if (dirty){ e.preventDefault(); e.returnValue=''; } });

applyViewFromHash();
loadData();
