<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Core alap – Edzésidőzítő</title>

<style>
  :root{
    --bg: #12201B;
    --surface: #1B2C25;
    --surface-2: #24392F;
    --line: rgba(242,245,241,0.10);
    --text: #F2F5F1;
    --text-dim: #9FB3A8;
    --work: #8FBF9F;
    --work-deep: #6FA482;
    --rest: #E8B984;
    --rest-deep: #D69C5C;
    --prep: #A9B8C4;
    --warmup: #93BFDB;
    --cooldown: #BBA6DA;
    --done: #E8D48A;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #1A2C24 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  .num{ font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
  }

  header{ margin-bottom:6px; }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .menu-btn{
    width:38px; height:38px; flex:none;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .menu-btn svg{ width:18px; height:18px; }
  header h1{
    flex:1;
    text-align:center;
  }

  .drawer-backdrop{
    position:fixed; inset:0;
    background:rgba(6,12,9,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:40;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; top:0; left:0; bottom:0;
    width:min(80vw, 300px);
    background:var(--surface);
    border-right:1px solid var(--line);
    z-index:41;
    transform:translateX(-105%);
    transition:transform 0.28s ease;
    display:flex;
    flex-direction:column;
    padding: max(20px, env(safe-area-inset-top)) 16px 16px;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .drawer-head h2{ font-size:15px; margin:0; font-weight:700; }
  .drawer-close{
    width:32px; height:32px; border-radius:8px;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .drawer-close svg{ width:16px; height:16px; }
  .workout-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 12px;
    border-radius:12px;
    margin-bottom:6px;
    cursor:pointer;
  }
  .workout-item.active{ background:var(--surface-2); }
  .workout-item-name{ font-size:14.5px; font-weight:600; }
  .workout-item-check{ width:16px; height:16px; color:var(--work); flex:none; opacity:0; }
  .workout-item.active .workout-item-check{ opacity:1; }
  .rounds-box{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 12px;
    border-top:1px solid var(--line);
    margin-top:8px;
  }
  .rounds-label{ font-size:13.5px; font-weight:600; color:var(--text); }
  .rounds-stepper{ display:flex; align-items:center; gap:12px; }
  .rounds-btn{
    width:30px; height:30px; border-radius:8px; flex:none;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .rounds-btn svg{ width:15px; height:15px; }
  .rounds-btn:disabled{ opacity:0.35; cursor:default; }
  .rounds-value{ font-size:15px; font-weight:700; min-width:14px; text-align:center; }
  .drawer-note{ margin-top:auto; font-size:11.5px; color:var(--text-dim); line-height:1.5; }
  a.drawer-note:hover{ color:var(--text); }
  header h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
  }
  header .round{
    font-size:11.5px;
    color:var(--text-dim);
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-align:right;
  }
  .header-stats{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .stat-pill{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 11px;
    font-size:12px;
    color:var(--text-dim);
    flex:1;
    justify-content:center;
  }
  .stat-pill svg{ width:13px; height:13px; flex:none; opacity:0.85; }
  .stat-pill b{ color:var(--text); font-weight:700; }
  .stat-pill .num{ font-weight:700; }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding: 10px 0 4px;
  }

  .ring-wrap{ position:relative; width:min(56vw, 250px); height:min(56vw, 250px); }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--line); stroke-width:10; }
  .ring-fg{ fill:none; stroke-width:10; stroke-linecap:round; transition: stroke 0.3s ease; }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
  }
  .ring-time{ font-size:clamp(36px,10vw,52px); font-weight:700; line-height:1; }
  .ring-phase{ font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; }
  .ring-phase.prep{ color:var(--prep); }
  .ring-phase.warmup, .ring-phase.warmup_rest{ color:var(--warmup); }
  .ring-phase.block_rest{ color:var(--rest); }
  .ring-phase.main_work{ color:var(--work); }
  .ring-phase.main_rest, .ring-phase.round_rest{ color:var(--rest); }
  .ring-phase.cooldown, .ring-phase.cooldown_rest{ color:var(--cooldown); }
  .ring-phase.done{ color:var(--done); }

  .next-hint{ font-size:12.5px; color:var(--text-dim); text-align:center; min-height:16px; margin-top:10px; }
  .next-hint b{ color:var(--text); font-weight:600; }

  .dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:280px; min-height:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--line); transition:background 0.25s; }
  .dot.done{ background:var(--work-deep); }
  .dot.active{ background:var(--work); box-shadow:0 0 0 3px rgba(143,191,159,0.22); }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    margin-top:14px;
    flex:none;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
  }
  .card-head-text{ display:flex; flex-direction:column; gap:2px; }
  .card-title{ font-size:16px; font-weight:700; }
  .card-hint{ font-size:11.5px; color:var(--text-dim); }
  .chev{ width:20px; height:20px; color:var(--text-dim); transition:transform 0.25s ease; flex:none; }
  .card.open .chev{ transform:rotate(180deg); }

  .card-body{
    max-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    transition:max-height 0.32s ease;
  }
  .card.open .card-body{ max-height:min(58vh, 460px); }
  .card-body-inner{
    padding:2px 16px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .fig-box{
    width:120px; height:120px;
    background:var(--surface-2);
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .fig{ stroke:var(--work); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .pose-b{ opacity:0; }
  @keyframes fadeA { 0%,40%{opacity:1} 50%,90%{opacity:0} 100%{opacity:1} }
  @keyframes fadeB { 0%,40%{opacity:0} 50%,90%{opacity:1} 100%{opacity:0} }
  @media (prefers-reduced-motion: no-preference){
    .pose-a{ animation: fadeA 2.6s ease-in-out infinite; }
    .pose-b{ animation: fadeB 2.6s ease-in-out infinite; }
  }
  .desc{ font-size:13.5px; line-height:1.55; color:var(--text-dim); text-align:left; user-select:text; -webkit-user-select:text; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:16px;
    flex:none;
  }
  .ctrl-btn{
    border:none;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ctrl-btn svg{ width:20px; height:20px; }
  .ctrl-small{ width:48px; height:48px; border-radius:50%; }
  .ctrl-main{
    width:72px; height:72px; border-radius:50%;
    background: linear-gradient(160deg, var(--work) 0%, var(--work-deep) 100%);
    color:#0F1C16;
    box-shadow: 0 8px 24px -8px rgba(143,191,159,0.55);
  }
  .ctrl-main svg{ width:28px; height:28px; }

  .foot-row{
    display:flex; align-items:center; justify-content:center;
    margin-top:10px;
    flex:none;
  }
  .mute-btn{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; color:var(--text-dim);
    font-size:12px; padding:8px; cursor:pointer;
  }
  .mute-btn svg{ width:16px; height:16px; }
  .foot-sep{ width:1px; height:14px; background:var(--line); margin:0 2px; }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(6,12,9,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal-panel{
    width:100%; max-width:420px;
    max-height:80vh;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    transform:translateY(12px) scale(0.98);
    opacity:0;
    transition:transform 0.25s ease, opacity 0.25s ease;
  }
  .modal-backdrop.open .modal-panel{ transform:translateY(0) scale(1); opacity:1; }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .modal-head h2{ font-size:15px; margin:0; font-weight:700; }
  .modal-close{
    width:32px; height:32px; border-radius:8px;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex:none;
  }
  .modal-close svg{ width:16px; height:16px; }
  .modal-body{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 18px 18px;
  }
  .summary-total{
    font-size:13px; color:var(--text-dim);
    padding:10px 0 4px;
  }
  .summary-total b{ color:var(--text); }
  .summary-section{ margin-top:14px; }
  .summary-section-title{
    font-size:11.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:6px;
  }
  .summary-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0;
    font-size:14px;
    border-top:1px solid var(--line);
  }
  .summary-section .summary-row:first-of-type{ border-top:none; }
  .summary-row.rest{ color:var(--text-dim); font-size:12.5px; }
  .summary-row span:last-child{ flex:none; padding-left:12px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-top">
      <button class="menu-btn" id="btnMenu" aria-label="Edzések">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="appTitle">Core alap</h1>
      <div class="round num" id="roundLabel">KÉSZÜLJ</div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span class="num" id="statTime">39:40</span>&nbsp;hátra
      </div>
      <div class="stat-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span class="num" id="statTasks">17</span>&nbsp;feladat hátra
      </div>
    </div>
  </header>

  <div class="stage">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-time num" id="ringTime">00:10</div>
        <div class="ring-phase prep" id="ringPhase">KÉSZÜLJ</div>
      </div>
    </div>

    <div class="dots" id="dots"></div>
  </div>

  <div class="card" id="exCard">
    <div class="card-head" id="cardHead">
      <div class="card-head-text">
        <div class="card-title" id="cardTitle">Bird-dog</div>
        <div class="card-hint">Koppints a mozgásért és a leírásért</div>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="card-body">
      <div class="card-body-inner">
        <div class="fig-box" id="figBox">
          <svg viewBox="0 0 80 80" width="88" height="88" id="cardFig"></svg>
          <img id="cardImg" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:14px;display:none;">
        </div>
        <div class="desc" id="cardDesc"></div>
      </div>
    </div>
  </div>

  <div class="next-hint" id="nextHint">Kezdéshez nyomd a ▶ gombot</div>

  <div class="controls">
    <button class="ctrl-btn ctrl-small" id="btnBack" aria-label="Előző szakasz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg>
    </button>
    <button class="ctrl-btn ctrl-main" id="btnPlay" aria-label="Indítás / Szünet">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn ctrl-small" id="btnFwd" aria-label="Következő szakasz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
    </button>
  </div>

  <div class="foot-row">
    <button class="mute-btn" id="btnMute">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
      <span id="muteLabel">Hang be</span>
    </button>
    <div class="foot-sep"></div>
    <button class="mute-btn" id="btnSummary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Teljes lista</span>
    </button>
  </div>

</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Edzések</h2>
    <button class="drawer-close" id="drawerClose" aria-label="Bezárás">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="workout-list" id="workoutList"></div>
  <div class="rounds-box">
    <span class="rounds-label">Körök száma</span>
    <div class="rounds-stepper">
      <button class="rounds-btn" id="btnRoundsMinus" aria-label="Kevesebb kör">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <span class="rounds-value num" id="roundsValue">2</span>
      <button class="rounds-btn" id="btnRoundsPlus" aria-label="Több kör">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <a class="drawer-note" href="/szerkeszto" target="_blank" rel="noopener" style="display:flex; align-items:center; gap:6px; text-decoration:none;">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    Edzések szerkesztése
  </a>
</div>

<div class="modal-backdrop" id="summaryBackdrop">
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="summaryTitle">Teljes feladatlista</h2>
      <button class="modal-close" id="summaryClose" aria-label="Bezárás">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="summaryBody"></div>
  </div>

<script>
// If anything throws while the app is wiring itself up, the buttons never get
// their listeners and the whole screen looks frozen with no clue why. Showing
// the message makes that diagnosable instead of silent.
window.addEventListener('error', function(e){
  try{
    const hint = document.getElementById('nextHint');
    if (hint) hint.textContent = 'Hiba: ' + (e.message || 'ismeretlen') +
      (e.lineno ? ' (sor ' + e.lineno + ')' : '');
  } catch(_){}
});
// Egy await-elt, el nem kapott hiba nem 'error', hanem 'unhandledrejection'
// eseményt vált ki - enélkül a figyelő nélkül egy ilyen hiba néma, teljes
// lefagyásnak tűnne, mert a gombok soha nem kapnák meg az eseménykezelőiket.
window.addEventListener('unhandledrejection', function(e){
  try{
    const hint = document.getElementById('nextHint');
    const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    if (hint) hint.textContent = 'Hiba: ' + msg;
  } catch(_){}
});

(async function(){

  let WORKOUTS = {};
  let WORKOUT_ORDER = [];
  let roundsByWorkout = {};
  let currentWorkoutId = 'core-alap';
  let WARMUP = [], MAIN = [], COOLDOWN = [];
  // A fő blokk körönként váltakozó gyakorlatait feloldó függvény
  // (workout-váltáskor és adatbetöltéskor frissül). Lásd makeMainResolver.
  let mainForRound = null;
  let ROUNDS_MIN = 1, ROUNDS_MAX = 5;
  let ROUNDS = 2;
  let WORK_SEC = 40, REST_SEC = 10, QUICK_REST_SEC = 5, ROUND_REST_SEC = 60, PREP_SEC = 10, BLOCK_TRANSITION_SEC = 10;

  // A gyakorlatok és edzésprogramok a data/trainings.json fájlból töltődnek be
  // (a Netlify build generálja a data/ mappából). A szerkesztőben mentett
  // módosítás egy git commitot tol a dev branchre, a deploy pedig ~1 perc múlva
  // frissíti ezt a fájlt. Ha a betöltés meghiúsul, hibasáv jelenik meg.

  // Egy normalizált ('sided') gyakorlat-rekordot alakít 1 vagy 2 lapos
  // (a régi, beégetett formátumnak megfelelő) elemmé. A blockItem az adott
  // program-blokkban lévő hivatkozás (esetleges felülírásokkal), az exercise
  // pedig a gyakorlatkönyvtár rekordja.
  function expandBlockItem(blockItem, exercise){
    if (!exercise) return [];
    const base = {
      name: exercise.name,
      desc: exercise.description,
      img: exercise.image,
      sub: exercise.subtitle,
      poseA: exercise.legacy_pose_a,
      poseB: exercise.legacy_pose_b,
    };
    if (exercise.duration_sec != null) base.duration = exercise.duration_sec;

    if (exercise.sided){
      const left = Object.assign({}, base, {
        name: base.name + (exercise.side_labels ? ' – ' + exercise.side_labels.left : ''),
      });
      const right = Object.assign({}, base, {
        name: base.name + (exercise.side_labels ? ' – ' + exercise.side_labels.right : ''),
        desc: exercise.description_switch || base.desc,
        img: exercise.image_right || base.img,
        mirror: !!exercise.mirror,
        quickRest: blockItem.quickRestOverride != null ? blockItem.quickRestOverride : true,
      });
      return [left, right];
    }

    const item = Object.assign({}, base);
    if (blockItem.durationOverride != null) item.duration = blockItem.durationOverride;
    const quickRest = blockItem.quickRest != null ? blockItem.quickRest : !!exercise.quick_rest_default;
    if (quickRest) item.quickRest = true;
    return [item];
  }

  function expandBlock(block, exercisesById){
    const out = [];
    (block || []).forEach(blockItem => {
      out.push(...expandBlockItem(blockItem, exercisesById[blockItem.exerciseId]));
    });
    return out;
  }

  // Egy fő-blokk elemhez a körhöz (1-alapú) tartozó gyakorlatot adja vissza.
  // A "variáns-lánc" = [exerciseId, ...variants]; az N. kör a lánc
  // (N-1) % hossz indexű elemét használja, tehát a variánsok körről körre
  // ismétlődnek (2 variáns: A, B, A, B, ...). Hiányzó hivatkozásnál az
  // alap exerciseId-re esik vissza.
  function pickVariantExercise(item, round, exercisesById){
    const chain = [item.exerciseId].concat(Array.isArray(item.variants) ? item.variants : []);
    const r = Math.max(1, round | 0);
    const idx = (r - 1) % chain.length;
    return exercisesById[chain[idx]] || exercisesById[item.exerciseId];
  }

  // A fő blokk nyers elemeiből olyan függvényt készít, amely egy adott körre
  // kibontott (a régi lapos formátumú) gyakorlat-tömböt ad vissza. Körönként
  // gyorsítótáraz. A szerkesztő gondoskodik róla, hogy egy pozíció összes
  // variánsa azonos oldalisággal (sided) bírjon, így a lépésszám köröktől
  // független marad.
  function makeMainResolver(rawMain, exercisesById){
    const cache = {};
    return function mainRound(round){
      const r = Math.max(1, round | 0);
      if (cache[r]) return cache[r];
      const out = [];
      (rawMain || []).forEach(item => {
        out.push(...expandBlockItem(item, pickVariantExercise(item, r, exercisesById)));
      });
      cache[r] = out;
      return out;
    };
  }

  function applyTrainingData(data){
    const exercisesById = data.exercises || {};
    const c = data.constants || {};

    WORKOUTS = {};
    WORKOUT_ORDER = [];
    roundsByWorkout = {};
    (data.programs || []).forEach(p => {
      const blocks = p.blocks || {};
      WORKOUTS[p.id] = {
        name: p.name,
        warmup: expandBlock(blocks.warmup, exercisesById),
        main: expandBlock(blocks.main, exercisesById),
        mainForRound: makeMainResolver(blocks.main, exercisesById),
        cooldown: expandBlock(blocks.cooldown, exercisesById)
      };
      WORKOUT_ORDER.push({ id: p.id, name: p.name });
      roundsByWorkout[p.id] = p.rounds;
    });

    ROUNDS_MIN = c.rounds_min;
    ROUNDS_MAX = c.rounds_max;
    WORK_SEC = c.work_sec;
    REST_SEC = c.rest_sec;
    QUICK_REST_SEC = c.quick_rest_sec;
    ROUND_REST_SEC = c.round_rest_sec;
    PREP_SEC = c.prep_sec;
    BLOCK_TRANSITION_SEC = c.block_transition_sec;

    currentWorkoutId = (WORKOUT_ORDER[0] && WORKOUT_ORDER[0].id) || 'core-alap';
    WARMUP = WORKOUTS[currentWorkoutId].warmup;
    MAIN = WORKOUTS[currentWorkoutId].main;
    mainForRound = WORKOUTS[currentWorkoutId].mainForRound;
    COOLDOWN = WORKOUTS[currentWorkoutId].cooldown;
    ROUNDS = roundsByWorkout[currentWorkoutId];
  }

  // A tréning-adat a `data/trainings.json` statikus fájlból jön, amit a Netlify
  // build generál a `data/` mappa kis fájljaiból (scripts/build-data.mjs). Ez
  // ugyanabból a deployból, ugyanarról a CDN-ről érkezik, mint maga ez az oldal,
  // ezért ha a HTML betöltődött, a JSON is be fog. A `no-cache` ETag-alapú
  // újraellenőrzést kényszerít, hogy friss deploy után ne jöjjön elavult másolat.
  async function loadTrainingData(){
    try{
      const res = await fetch('data/trainings.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      applyTrainingData(data);
    } catch(err){
      console.error('Nem sikerült betölteni a data/trainings.json adatot:', err);
      showLoadErrorBanner(err);
      throw err;
    }
  }

  function showLoadErrorBanner(err){
    try{
      const b = document.createElement('div');
      b.textContent = 'Nem sikerült betölteni az edzésadatokat. Ellenőrizd a hálózatot és tölts újra.';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#C4553B;color:#fff;'
        + 'font-size:12px;text-align:center;padding:5px 8px;font-weight:600;';
      document.body.appendChild(b);
    } catch(_){}
  }

  await loadTrainingData();


  function restDurationBefore(item){
    return (item && item.quickRest) ? QUICK_REST_SEC : REST_SEC;
  }

  // A fő blokk i. lépése az adott körben (1-alapú). Ha nincs feloldó vagy a
  // kör tömbje rövidebb (nem várt oldalisági eltérés), az 1. körre esik vissza.
  function mainItem(i, round){
    const arr = (mainForRound && mainForRound(round)) || MAIN;
    return arr[i] || MAIN[i];
  }

  function buildQueue(){
    const q = [{ kind:'prep', duration: PREP_SEC }];

    if (WARMUP.length){
      WARMUP.forEach((w,i) => {
        q.push({ kind:'warmup', duration:(w.duration || WORK_SEC), index:i });
        if (i < WARMUP.length - 1) q.push({ kind:'warmup_rest', duration:restDurationBefore(WARMUP[i+1]), nextIndex:i+1 });
      });
      q.push({ kind:'block_rest', duration:BLOCK_TRANSITION_SEC, nextBlock:'main' });
    }

    for (let r = 1; r <= ROUNDS; r++){
      for (let i = 0; i < MAIN.length; i++){
        q.push({ kind:'main_work', duration: (mainItem(i, r).duration || WORK_SEC), index:i, round:r });
        if (i < MAIN.length - 1) q.push({ kind:'main_rest', duration: restDurationBefore(mainItem(i+1, r)), nextIndex:i+1, round:r });
      }
      if (r < ROUNDS) q.push({ kind:'round_rest', duration: ROUND_REST_SEC, round:r });
    }

    if (COOLDOWN.length){
      q.push({ kind:'block_rest', duration:BLOCK_TRANSITION_SEC, nextBlock:'cooldown' });
      COOLDOWN.forEach((c,i) => {
        q.push({ kind:'cooldown', duration:(c.duration || WORK_SEC), index:i });
        if (i < COOLDOWN.length - 1) q.push({ kind:'cooldown_rest', duration:restDurationBefore(COOLDOWN[i+1]), nextIndex:i+1 });
      });
    }
    q.push({ kind:'done', duration: 0 });
    return q;
  }

  let queue = buildQueue();

  let qIndex = 0;
  let remainingMs = queue[0].duration * 1000;
  let running = false;
  let endTime = null;
  let tickHandle = null;
  let lastDecade = null;
  let lastSecondBeep = null;
  let spokenThisPhase = false;
  let audioCtx = null;
  let muted = false;
  let cardOpen = false;
  let huVoice = null;

  const ringFg = document.getElementById('ringFg');
  const ringTime = document.getElementById('ringTime');
  const ringPhase = document.getElementById('ringPhase');
  const roundLabel = document.getElementById('roundLabel');
  const statTime = document.getElementById('statTime');
  const statTasks = document.getElementById('statTasks');
  const nextHint = document.getElementById('nextHint');
  const dotsEl = document.getElementById('dots');
  const exCard = document.getElementById('exCard');
  const cardHead = document.getElementById('cardHead');
  const cardTitle = document.getElementById('cardTitle');
  const cardDesc = document.getElementById('cardDesc');
  const cardFig = document.getElementById('cardFig');
  const cardImg = document.getElementById('cardImg');
  const figBox = document.getElementById('figBox');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const btnBack = document.getElementById('btnBack');
  const btnFwd = document.getElementById('btnFwd');
  const btnMute = document.getElementById('btnMute');
  const muteLabel = document.getElementById('muteLabel');

  const DEFAULT_IMG = 'images/default.webp';

  const CIRC = 2 * Math.PI * 52;
  ringFg.setAttribute('stroke-dasharray', CIRC.toFixed(1));

  function buildDots(){
    dotsEl.innerHTML = '';
    MAIN.forEach((ex, i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      d.dataset.i = i;
      dotsEl.appendChild(d);
    });
  }
  buildDots();

  function fmtTime(totalSec){
    const s = Math.max(0, Math.ceil(totalSec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }

  const TASK_KINDS = ['warmup','main_work','cooldown'];

  function computeRemainingTotals(){
    let totalMs = remainingMs;
    let tasksLeft = TASK_KINDS.includes(queue[qIndex].kind) ? 1 : 0;
    for (let i = qIndex + 1; i < queue.length; i++){
      totalMs += queue[i].duration * 1000;
      if (TASK_KINDS.includes(queue[i].kind)) tasksLeft++;
    }
    return { totalMs, tasksLeft };
  }

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function phaseColor(kind){
    switch(kind){
      case 'main_work': return cssVar('--work');
      case 'main_rest': case 'round_rest': case 'block_rest': return cssVar('--rest');
      case 'warmup': case 'warmup_rest': return cssVar('--warmup');
      case 'cooldown': case 'cooldown_rest': return cssVar('--cooldown');
      case 'prep': return cssVar('--prep');
      case 'done': return cssVar('--done');
      default: return cssVar('--text');
    }
  }

  function phaseWord(kind){
    switch(kind){
      case 'prep': return 'KÉSZÜLJ';
      case 'warmup': return 'BEMELEGÍTÉS';
      case 'warmup_rest': return 'PIHENÉS';
      case 'block_rest': return 'KÉSZÜLJ';
      case 'main_work': return 'MUNKA';
      case 'main_rest': case 'round_rest': return 'PIHENÉS';
      case 'cooldown': return 'LEVEZETÉS';
      case 'cooldown_rest': return 'PIHENÉS';
      case 'done': return 'KÉSZ';
      default: return '';
    }
  }

  function topLabel(phase){
    switch(phase.kind){
      case 'prep': return 'KÉSZÜLJ';
      case 'warmup': case 'warmup_rest': return 'BEMELEGÍTÉS';
      case 'block_rest': return phase.nextBlock === 'main' ? 'A KÖR KÖVETKEZIK' : 'A LEVEZETÉS KÖVETKEZIK';
      case 'main_work': case 'main_rest': return 'KÖR ' + phase.round + ' / ' + ROUNDS;
      case 'round_rest': return 'KÖR ' + phase.round + ' / ' + ROUNDS + ' KÉSZ';
      case 'cooldown': case 'cooldown_rest': return 'LEVEZETÉS';
      case 'done': return 'KÉSZ';
      default: return '';
    }
  }

  function getCardExercise(phase){
    switch(phase.kind){
      case 'prep': return WARMUP.length ? WARMUP[0] : mainItem(0, 1);
      case 'warmup': return WARMUP[phase.index];
      case 'warmup_rest': return WARMUP[phase.nextIndex];
      case 'block_rest': return phase.nextBlock === 'main' ? mainItem(0, 1) : COOLDOWN[0];
      case 'main_work': return mainItem(phase.index, phase.round);
      case 'main_rest': return mainItem(phase.nextIndex, phase.round);
      case 'round_rest': return mainItem(0, phase.round + 1);
      case 'cooldown': return COOLDOWN[phase.index];
      case 'cooldown_rest': return COOLDOWN[phase.nextIndex];
      default: return null;
    }
  }

  function getNextHint(phase){
    switch(phase.kind){
      case 'prep': return WARMUP.length
        ? 'Bemelegítés: <b>' + WARMUP[0].name + '</b>'
        : 'Következő: <b>' + mainItem(0, 1).name + '</b>';
      case 'warmup':
        return phase.index < WARMUP.length - 1
          ? 'Következő: <b>' + WARMUP[phase.index+1].name + '</b>'
          : 'A fő kör következik';
      case 'warmup_rest': return 'Következő: <b>' + WARMUP[phase.nextIndex].name + '</b>';
      case 'block_rest':
        return phase.nextBlock === 'main'
          ? 'Következő: <b>' + mainItem(0, 1).name + '</b>'
          : 'Következő: <b>' + COOLDOWN[0].name + '</b>';
      case 'main_work': {
        if (phase.index < MAIN.length - 1) return 'Következő: <b>' + mainItem(phase.index+1, phase.round).name + '</b>';
        if (phase.round < ROUNDS) return 'Kör vége, pihenő következik';
        return 'A levezetés következik';
      }
      case 'main_rest': return 'Következő: <b>' + mainItem(phase.nextIndex, phase.round).name + '</b>';
      case 'round_rest': return 'Következő kör: <b>' + mainItem(0, phase.round + 1).name + '</b>';
      case 'cooldown':
        return phase.index < COOLDOWN.length - 1
          ? 'Következő: <b>' + COOLDOWN[phase.index+1].name + '</b>'
          : 'Utolsó szakasz';
      case 'cooldown_rest': return 'Következő: <b>' + COOLDOWN[phase.nextIndex].name + '</b>';
      case 'done': return 'Szép munka volt!';
      default: return '';
    }
  }

  function renderExerciseCard(ex){
    if (!ex){ exCard.style.display = 'none'; return; }
    exCard.style.display = '';
    cardTitle.textContent = ex.name;
    cardDesc.textContent = ex.desc;
    if (ex.img){
      figBox.style.display = '';
      cardFig.style.display = 'none';
      cardFig.innerHTML = '';
      cardImg.style.display = '';
      cardImg.src = ex.img;
    } else if (ex.poseA && ex.poseB){
      figBox.style.display = '';
      cardImg.style.display = 'none';
      cardImg.src = '';
      cardFig.style.display = '';
      const openMirror = ex.mirror ? '<g transform="scale(-1,1) translate(-80,0)">' : '';
      const closeMirror = ex.mirror ? '</g>' : '';
      cardFig.innerHTML =
        openMirror +
        '<g class="fig pose-a">' + ex.poseA + '</g>' +
        '<g class="fig pose-b">' + ex.poseB + '</g>' +
        closeMirror;
    } else {
      figBox.style.display = '';
      cardFig.style.display = 'none';
      cardFig.innerHTML = '';
      cardImg.style.display = '';
      cardImg.src = DEFAULT_IMG;
    }
  }

  function render(){
    const phase = queue[qIndex];
    const totalSec = phase.duration;
    const remSec = remainingMs / 1000;

    ringTime.textContent = phase.kind === 'done' ? '✓' : fmtTime(remSec);
    ringFg.style.stroke = phaseColor(phase.kind);
    const frac = totalSec > 0 ? Math.max(0, Math.min(1, remSec / totalSec)) : 0;
    ringFg.setAttribute('stroke-dashoffset', (-CIRC * (1 - frac)).toFixed(1));

    ringPhase.className = 'ring-phase ' + phase.kind;
    ringPhase.textContent = phaseWord(phase.kind);
    roundLabel.textContent = topLabel(phase);
    nextHint.innerHTML = getNextHint(phase);

    dotsEl.style.display = (phase.kind === 'main_work' || phase.kind === 'main_rest' || phase.kind === 'round_rest') ? 'flex' : 'none';
    if (dotsEl.style.display === 'flex'){
      Array.from(dotsEl.children).forEach((d, i) => {
        d.classList.remove('done','active');
        if (phase.kind === 'main_work'){
          if (i < phase.index) d.classList.add('done');
          else if (i === phase.index) d.classList.add('active');
        } else if (phase.kind === 'main_rest'){
          if (i < phase.nextIndex) d.classList.add('done');
        } else if (phase.kind === 'round_rest'){
          d.classList.add('done');
        }
      });
    }

    renderExerciseCard(getCardExercise(phase));

    if (phase.kind === 'done'){
      statTime.textContent = '00:00';
      statTasks.textContent = '0';
    } else {
      const totals = computeRemainingTotals();
      statTime.textContent = fmtTime(totals.totalMs / 1000);
      statTasks.textContent = String(totals.tasksLeft);
    }

    playIcon.innerHTML = running
      ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  // never takes effect again. If a resume attempt doesn't bring it back, the
  // context is thrown away and rebuilt, which is what actually restores beeps.
  let audioStuckSince = 0;

  function tryResume(){
    if (!audioCtx) return;

    } catch(e){}
  }

  // Playing one silent sample is what actually unlocks Web Audio on iOS. It
  // has to happen while a user gesture is still on the stack, otherwise the
  // context stays suspended no matter how often resume() is called later.
  function primeAudio(){
    if (!audioCtx) return;

      const src = audioCtx.createBufferSource();

      src.connect(audioCtx.destination);

  function ensureAudio(inGesture){

      return;

    if (!audioStuckSince) audioStuckSince = now;

    // one comes back suspended, which would just churn every few seconds.

  function pickHuVoice(){
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    huVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('hu')) || null;
  }
  if ('speechSynthesis' in window){
    pickHuVoice();
    if ('onvoiceschanged' in window.speechSynthesis){

    }
  }

  const REST_KINDS = ['prep','warmup_rest','main_rest','round_rest','cooldown_rest','block_rest'];

  function speakNextExercise(phase){
    if (muted) return;
    if (!('speechSynthesis' in window)) return;
    const ex = getCardExercise(phase);
    if (!ex || !ex.name) return;
    const synth = window.speechSynthesis;
    // iOS can leave the utterance queue paused or stuck behind an item that
    // never finishes; clearing and resuming first stops announcements from
    // piling up and arriving seconds late.
    try{ synth.cancel(); synth.resume(); } catch(e){}
    const utter = new SpeechSynthesisUtterance(ex.name);
    if (huVoice) utter.voice = huVoice;
    utter.lang = (huVoice && huVoice.lang) || 'hu-HU';
    utter.rate = 1;
    utter.pitch = 1;
    // A speak() issued in the same turn as cancel() is silently dropped on
    // some iOS versions, so hand it over on the next event-loop turn.
    setTimeout(() => { try{ synth.speak(utter); } catch(e){} }, 0);
  }

  // Announces the upcoming exercise as soon as a rest phase begins.
  // Guarded by spokenThisPhase so the several call sites stay idempotent.
  function speakOnPhaseEnter(){
    const phase = queue[qIndex];

  function unlockSpeech(){
    if (!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance('.');
      utter.volume = 0;
      window.speechSynthesis.speak(utter);
    } catch(e){}
  }

  const keepAliveAudio = document.getElementById('keepAliveAudio');

  function startKeepAwakeMedia(){

    // motorban (pl. iOS-en bizonyos háttérből visszatérő állapotban) szinkron
    // hibát is dobhat - ez nélkül a próbálkozás megszakítaná a teljes play()
    // hívást, és onnantól semmilyen gombnyomás nem tudna újra lefutni.
    try{
      if (keepAwakeVideo && keepAwakeVideo.paused){
        keepAwakeVideo.play().catch(() => { /* retried on the next tick */ });
      }
    } catch(e){ /* lásd fenti megjegyzés */ }
    // A looping silent audio track keeps the media session alive, which is
    // what lets beeps/speech resume promptly instead of the audio pipeline
    // being torn down whenever the app loses focus.
    try{
      if (keepAliveAudio && keepAliveAudio.paused){
        keepAliveAudio.volume = 0.001;
        keepAliveAudio.play().catch(() => { /* retried on the next tick */ });
      }
    } catch(e){ /* lásd fenti megjegyzés */ }
  }

    if (keepAwakeVideo) keepAwakeVideo.pause();

  const beepPool = { mid: [], high: [] };
  function initBeepPool(){
    try{
      ['mid','high'].forEach(tone => {
        if (beepPool[tone].length) return;
        for (let i = 0; i < 4; i++){
          const a = new Audio(BEEP_SRC[tone]);
          a.preload = 'auto';
          a.volume = 1;
          beepPool[tone].push(a);
        }
      });
    } catch(e){ /* fallback beeps unavailable; Web Audio still handles them */ }
  }
  let beepCursor = 0;
  function elementBeep(tone){
    initBeepPool();
    const pool = beepPool[tone];
    if (!pool.length) return;
    const a = pool[beepCursor++ % pool.length];
    try{
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch(e){}
  }

  function toneName(freq){ return freq >= 1000 ? 'high' : 'mid'; }

  // Schedules a beep through Web Audio when it is healthy, otherwise falls
  // back to a media element. `delay` is seconds from now.
  function beep(freq, dur, delay){
    if (muted) return;
    if (audioReady()){
      try{
        const when = audioCtx.currentTime + Math.max(0.01, delay);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(0.35, when + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(when);
        osc.stop(when + dur + 0.02);
        return;
      } catch(e){ /* drop through to the element fallback */ }

    if (delay <= 0.02) elementBeep(tone);
    else setTimeout(() => elementBeep(tone), delay * 1000);
  }

  function playProgressBeeps(n){
    if (muted) return;
    for (let i = 0; i < n; i++){
      beep(880, 0.1, 0.02 + i * 0.16);
    }
  }

  function maybeBeep(){
    const phase = queue[qIndex];
    if (phase.duration <= 0) return;
    const elapsedSec = (phase.duration * 1000 - remainingMs) / 1000;
    const decade = Math.floor((elapsedSec + 0.05) / 10);
    if (decade > 0 && decade * 10 < phase.duration && decade !== lastDecade){
      lastDecade = decade;
      playProgressBeeps(decade);

  });

    const wasRunning = running;
    pause();

    lastSecondBeep = null;

    document.getElementById('muteIcon').style.opacity = muted ? 0.4 : 1;
  });

  cardHead.addEventListener('click', () => {
    cardOpen = !cardOpen;
    exCard.classList.toggle('open', cardOpen);
  });

  function buildSummaryHTML(){
    let totalSec = 0;
    queue.forEach(p => totalSec += p.duration);

    const sections = [];
    let current = null;
    function startSection(title){
      current = { title, rows: [] };
      sections.push(current);
    }
    function pushRow(name, dur, isRest){
      if (!current) startSection('');
      current.rows.push({ name, dur, isRest });
    }

    queue.forEach(phase => {
      switch(phase.kind){
        case 'warmup':
          if (!current || current.title !== 'Bemelegítés') startSection('Bemelegítés');
          pushRow(WARMUP[phase.index].name, phase.duration, false);
          break;
        case 'warmup_rest':
          pushRow('Pihenő', phase.duration, true);
          break;
        case 'main_work': {
          const title = 'Fő kör' + (ROUNDS > 1 ? ' – ' + phase.round + '. kör' : '');
          if (!current || current.title !== title) startSection(title);
          pushRow(mainItem(phase.index, phase.round).name, phase.duration, false);
          break;
        }
        case 'main_rest':
          pushRow('Pihenő', phase.duration, true);
          break;
        case 'round_rest':
          pushRow('Pihenő a körök között', phase.duration, true);
          break;
        case 'cooldown':
          if (!current || current.title !== 'Levezetés') startSection('Levezetés');
          pushRow(COOLDOWN[phase.index].name, phase.duration, false);
          break;
        case 'cooldown_rest':
          pushRow('Pihenő', phase.duration, true);
          break;
        default:
          break;
      }
    });

    let html = '<div class="summary-total">Teljes idő: <b>' + fmtTime(totalSec) + '</b></div>';
    sections.forEach(sec => {
      html += '<div class="summary-section">';
      if (sec.title) html += '<div class="summary-section-title">' + sec.title + '</div>';
      sec.rows.forEach(r => {
        html += '<div class="summary-row' + (r.isRest ? ' rest' : '') + '"><span>' + r.name + '</span><span class="num">' + fmtTime(r.dur) + '</span></div>';
      });
      html += '</div>';
    });
    return html;
  }

  const summaryBackdrop = document.getElementById('summaryBackdrop');
  const summaryBody = document.getElementById('summaryBody');
  const summaryTitle = document.getElementById('summaryTitle');
  const btnSummary = document.getElementById('btnSummary');
  const summaryClose = document.getElementById('summaryClose');

  function openSummary(){
    summaryTitle.textContent = WORKOUTS[currentWorkoutId].name + ' – teljes lista';
    summaryBody.innerHTML = buildSummaryHTML();
    summaryBackdrop.classList.add('open');
  }
  function closeSummary(){
    summaryBackdrop.classList.remove('open');
  }
  btnSummary.addEventListener('click', openSummary);
  summaryClose.addEventListener('click', closeSummary);
  summaryBackdrop.addEventListener('click', (e) => {
    if (e.target === summaryBackdrop) closeSummary();
  });

  const btnMenu = document.getElementById('btnMenu');
  const drawer = document.getElementById('drawer');
  const drawerBackdrop = document.getElementById('drawerBackdrop');
  const drawerClose = document.getElementById('drawerClose');
  const appTitle = document.getElementById('appTitle');
  const workoutListEl = document.getElementById('workoutList');
  let workoutItems = [];

  function renderWorkoutList(){
    workoutListEl.innerHTML = '';
    workoutItems = WORKOUT_ORDER.map(w => {
      const item = document.createElement('div');
      item.className = 'workout-item' + (w.id === currentWorkoutId ? ' active' : '');
      item.dataset.id = w.id;
      item.innerHTML = '<span class="workout-item-name"></span>'
        + '<svg class="workout-item-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      item.querySelector('.workout-item-name').textContent = w.name;
      item.addEventListener('click', () => switchWorkout(w.id));
      workoutListEl.appendChild(item);
      return item;
    });
  }

  function openDrawer(){
    drawer.classList.add('open');
    drawerBackdrop.classList.add('open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
  }
  btnMenu.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);

  function switchWorkout(id){
    if (id === currentWorkoutId){ closeDrawer(); return; }
    currentWorkoutId = id;
    const w = WORKOUTS[id];
    WARMUP = w.warmup;
    MAIN = w.main;
    mainForRound = w.mainForRound;
    COOLDOWN = w.cooldown;
    ROUNDS = roundsByWorkout[id];
    appTitle.textContent = w.name;

    pause();
    queue = buildQueue();
    qIndex = 0;
    remainingMs = queue[0].duration * 1000;
    lastDecade = null;
    lastSecondBeep = null;
    spokenThisPhase = false;
    cardOpen = false;
    exCard.classList.remove('open');

    buildDots();
    workoutItems.forEach(el => el.classList.toggle('active', el.dataset.id === id));
    renderRoundsUI();
    render();
    closeDrawer();
  }

  renderWorkoutList();
  appTitle.textContent = WORKOUTS[currentWorkoutId].name;

  const roundsValueEl = document.getElementById('roundsValue');
  const btnRoundsMinus = document.getElementById('btnRoundsMinus');
  const btnRoundsPlus = document.getElementById('btnRoundsPlus');

  function renderRoundsUI(){
    roundsValueEl.textContent = String(ROUNDS);
    btnRoundsMinus.disabled = ROUNDS <= ROUNDS_MIN;
    btnRoundsPlus.disabled = ROUNDS >= ROUNDS_MAX;
  }

  // Rebuilds the tail of the queue (from the current position onward) to
  // reflect a new ROUNDS value without disturbing anything already done.
  function rebuildQueueForNewRounds(){
    const phase = queue[qIndex];
    const mainKinds = ['main_work','main_rest','round_rest'];

    if (!mainKinds.includes(phase.kind)){
      // Not currently inside the main block. If the main block hasn't
      // started yet, the prep/warmup portion is identical regardless of
      // ROUNDS, so we can safely rebuild the whole queue in place.
      const passedMain = queue.slice(0, qIndex).some(p => mainKinds.includes(p.kind));
      if (!passedMain){
        queue = buildQueue();
        render();
      }
      // If the main block is already behind us (in cooldown / done), the
      // new round count only takes effect on the next start of this workout.
      return;
    }

    const round = phase.round;
    const tail = [];

    if (phase.kind === 'main_work'){
      for (let i = phase.index + 1; i < MAIN.length; i++){
        tail.push({ kind:'main_rest', duration: restDurationBefore(mainItem(i, round)), nextIndex:i, round });
        tail.push({ kind:'main_work', duration:(mainItem(i, round).duration || WORK_SEC), index:i, round });
      }
    } else if (phase.kind === 'main_rest'){
      for (let i = phase.nextIndex; i < MAIN.length; i++){
        if (i > phase.nextIndex) tail.push({ kind:'main_rest', duration: restDurationBefore(mainItem(i, round)), nextIndex:i, round });
        tail.push({ kind:'main_work', duration:(mainItem(i, round).duration || WORK_SEC), index:i, round });
      }
    }

    const startNextRound = phase.kind === 'round_rest' ? phase.round + 1 : round + 1;

    if (startNextRound <= ROUNDS){
      for (let r = startNextRound; r <= ROUNDS; r++){
        if (!(phase.kind === 'round_rest' && r === startNextRound)){
          tail.push({ kind:'round_rest', duration: ROUND_REST_SEC, round: r - 1 });
        }
        for (let i = 0; i < MAIN.length; i++){
          if (i > 0) tail.push({ kind:'main_rest', duration: restDurationBefore(mainItem(i, r)), nextIndex:i, round:r });
          tail.push({ kind:'main_work', duration:(mainItem(i, r).duration || WORK_SEC), index:i, round:r });
        }
      }
    }

    if (COOLDOWN.length){
      tail.push({ kind:'block_rest', duration: BLOCK_TRANSITION_SEC, nextBlock:'cooldown' });
      COOLDOWN.forEach((c,i) => {
        tail.push({ kind:'cooldown', duration:(c.duration || WORK_SEC), index:i });
        if (i < COOLDOWN.length - 1) tail.push({ kind:'cooldown_rest', duration:restDurationBefore(COOLDOWN[i+1]), nextIndex:i+1 });
      });
    }
    tail.push({ kind:'done', duration: 0 });

    queue = queue.slice(0, qIndex + 1).concat(tail);
    render();
  }

  function adjustRounds(delta){
    const next = Math.max(ROUNDS_MIN, Math.min(ROUNDS_MAX, ROUNDS + delta));
    if (next === ROUNDS) return;
    ROUNDS = next;
    roundsByWorkout[currentWorkoutId] = ROUNDS;
    renderRoundsUI();
    rebuildQueueForNewRounds();
  }

  btnRoundsMinus.addEventListener('click', () => adjustRounds(-1));
  btnRoundsPlus.addEventListener('click', () => adjustRounds(1));

  renderRoundsUI();
  render();
})();
</script>
</body>
</html>
